[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chi-index"
version = "3.0.0"
description = "External clustering validation based on the chi-squared statistic"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "José María Luna-Romera", email = "josemarialunaromera@gmail.com"}]
keywords = ["clustering", "chi-square", "validation", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.9", "build>=1", "twine>=6"]

[project.urls]
Homepage = "https://github.com/josemarialuna/Chi-Index"
Issues = "https://github.com/josemarialuna/Chi-Index/issues"
Paper = "https://doi.org/10.1016/j.ins.2019.02.046"

[tool.setuptools.packages.find]
include = ["chi_index", "chi_index.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["chi_index"]

[tool.coverage.report]
show_missing = true
fail_under = 90
