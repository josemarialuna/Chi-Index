name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.10"
            minimum: true
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[dev,plot]"
      - name: Install minimum dependency versions
        if: matrix.minimum
        run: python -m pip install numpy==1.23.5 pandas==1.5.3 scipy==1.9.3 scikit-learn==1.2.2 matplotlib==3.6.3
      - run: python -m pytest --cov --cov-report=term-missing
      - run: python -m ruff check .
      - run: python -m ruff format --check .
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel without plotting extra
        run: |
          python -m venv /tmp/chi-wheel
          /tmp/chi-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/chi-wheel/bin/python -c "import sys; from chi_index import chi_index_score; assert chi_index_score([0, 1], [0, 1]) == 2.0; assert 'matplotlib' not in sys.modules"
